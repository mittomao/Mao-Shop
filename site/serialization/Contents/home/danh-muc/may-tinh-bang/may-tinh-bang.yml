          FaqJson: '[{"q":"Làm sao để chọn mua máy tính bảng đúng nhu cầu?","a":"Hãy xác định nhu cầu chính (học tập, làm việc, giải trí), mức ngân sách, sau đó dùng bộ lọc \"Nhu cầu sử dụng\" và \"Xem theo giá\" để thu hẹp lựa chọn. Nhân viên MaoShop luôn sẵn sàng tư vấn miễn phí."},{"q":"MaoShop có thu cũ đổi mới khi mua máy tính bảng không?","a":"Có. Bạn mang máy cũ tới cửa hàng hoặc dùng công cụ \"Định giá máy chuyên sâu\" để biết giá thu, trợ giá lên đời đến 3 triệu."},{"q":"Chính sách trả góp 0% khi mua máy tính bảng như thế nào?","a":"Trả góp 0% qua thẻ tín dụng kỳ hạn 3–12 tháng, hoặc qua công ty tài chính chỉ cần CCCD, duyệt hồ sơ trong 5 phút."},{"q":"Sản phẩm được bảo hành bao lâu?","a":"Sản phẩm chính hãng được bảo hành 12 tháng, 1 đổi 1 trong 30 ngày nếu có lỗi phần cứng từ nhà sản xuất."},{"q":"Bao lâu thì nhận được hàng?","a":"Nội thành Hà Nội và TP.HCM giao nhanh trong 2 giờ. Các tỉnh khác giao trong 1–3 ngày, miễn phí cho đơn từ 300.000đ."}]'
